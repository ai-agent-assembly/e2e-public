name: Verify Public Stack (Scheduled)

on:
  workflow_dispatch:  # ad-hoc runs; always runs in latest mode
  schedule:
    - cron: "0 2 1,15 * *"  # 1st and 15th of each month at 02:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: "Verify [${{ matrix.area }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write  # report-failure.sh opens a GitHub issue per failing area

    # Shared by the run + summarize steps so the failure summary reads the report.
    env:
      PYTEST_JSON: /tmp/pytest-report-${{ matrix.area }}.json
    strategy:
      fail-fast: false
      matrix:
        area: [runtime, sdk, examples, install, conformance]

    steps:
      - name: Checkout integration-tests repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      # AAASM-6245 — the sdk area builds a Go consumer against the go-sdk
      # checkout, whose go.mod declares `go 1.26.0`. Without this step the lane
      # used whatever Go the runner image happened to ship (1.24.13), which is
      # below that floor, and the three tests/public/test_go_sdk.py source tests
      # failed on every scheduled run from 2026-08-01 onwards. `stable` is what
      # the five sibling verify workflows already install.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "stable"

      - name: Report the Go toolchain under test
        run: go version

      - name: Install uv
        run: pip install uv==0.11.31 --only-binary=':all:' --quiet

      - name: Install Python dependencies
        run: uv sync --locked --no-build --no-binary-package aasm-verify

      - name: Run verification (${{ matrix.area }})
        env:
          AREA: ${{ matrix.area }}
        run: |
          uv run --locked --no-build --no-binary-package aasm-verify aasm-verify public --mode latest --area "$AREA"

      - name: Summarize run on failure
        if: failure()
        env:
          AREA:    ${{ matrix.area }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/summarize-run.sh \
            --area    "$AREA" \
            --mode    latest \
            --run-url "$RUN_URL" \
            --output  /tmp/summary-"$AREA".json

      - name: Report failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AREA:         ${{ matrix.area }}
        run: |
          bash scripts/report-failure.sh \
            --summary /tmp/summary-"$AREA".json
