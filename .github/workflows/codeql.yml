name: CodeQL

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # First-party code is Python (CLI + suites) plus one Node driver
          # (tests/live/drivers/enforce_allow.mjs). Both are interpreted, so
          # build-mode none lets CodeQL extract them without a build step.
          # Go is intentionally omitted: the only module
          # (tests/live/drivers/go) uses a replace() pointing at a sibling
          # go-sdk checkout that does not exist in CI, so autobuild cannot
          # resolve it. Tracked as a CodeQL follow-up.
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # The repo's own GitHub Actions workflows are first-party code too —
          # they hold the release/live-verification credentials and run on
          # schedules, so a missing `permissions:` block or an injectable
          # `${{ }}` expression is a real supply-chain finding here. The
          # `actions` extractor declares `build_modes: [none]` (it parses the
          # workflow YAML directly), so `none` is the only valid value.
          - language: actions
            build-mode: none
          # TEMPORARY PROBE (AAASM-6120) — remove before merge. Two legs, to
          # settle with real CI evidence whether the Go omission below is still
          # justified: `none` tests whether the Go extractor accepts a buildless
          # extraction at all, `autobuild` re-tests the specific failure the
          # comment above asserts. `fail-fast: false` keeps the other three
          # languages reporting regardless of what these two do.
          - language: go
            build-mode: none
          - language: go
            build-mode: autobuild

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@65216971a11ded447a6b76263d5a144519e5eee1 # codeql-bundle-v2.25.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@65216971a11ded447a6b76263d5a144519e5eee1 # codeql-bundle-v2.25.2
        with:
          category: "/language:${{ matrix.language }}"
