version: 2
updates:
  # This project is uv-managed (uv.lock + [dependency-groups] in
  # pyproject.toml). The "pip" ecosystem does not update uv.lock — use the
  # dedicated "uv" ecosystem (GA since 2025-03) so Dependabot understands
  # pyproject.toml + uv.lock natively (AAASM-4437).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    ignore:
      # AAASM-4768 accepted risk: these are transitive-only deps pulled in by
      # crewai (frameworks extra), which hard-pins chromadb~=1.1.0,
      # json-repair~=0.25.2, and mcp~=1.26.0 on every released and
      # pre-released crewai~=1.15 version. All three windows sit entirely
      # inside their respective Dependabot alert ranges (GHSA-f4j7-r4q5-qw2c,
      # GHSA-xf7x-x43h-rpqh, GHSA-vj7q-gjh5-988w/GHSA-jpw9-pfvf-9f58/
      # GHSA-hvrp-rf83-w775) and cannot be bumped without either an upstream
      # crewai release that relaxes the pin or dropping crewai from this
      # repo's `frameworks` extra — neither is in scope here. Remove these
      # ignores once crewai adopts patched versions.
      - dependency-name: "chromadb"
      - dependency-name: "json-repair"
      - dependency-name: "mcp"

  # The two live Go driver modules (AAASM-6023). Without this block GitHub
  # still raised *alerts* for them — the dependency graph indexes any go.mod it
  # finds — but opened no PRs, because security updates need a declared
  # ecosystem. They had therefore never received a single automated update, and
  # their recorded indirect versions drifted until they no longer resolved
  # against the go-sdk `replace` target at all.
  - package-ecosystem: "gomod"
    directories:
      - "/tests/live/drivers/go"
      - "/tests/live/drivers/go/framework"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    # AAASM-6239: github/codeql-action/init and /analyze are separate
    # dependencies to Dependabot, but analyze refuses a configuration file
    # written by a different version of init ("Loaded a configuration file for
    # version '4.38.2', but running version '4.38.1'"). Ungrouped, one upstream
    # release opens one pull request per step and neither can ever merge: every
    # language leg fails and the top-level CodeQL check degrades to neutral, so
    # the page shows a CodeQL entry that is not red while no analysis ran at
    # all.
    #
    # Both groups are required. applies-to defaults to version-updates, so a
    # single entry would leave the security-advisory path splitting exactly as
    # before -- which is the path that matters most.
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action*"
      codeql-action-security:
        applies-to: security-updates
        patterns:
          - "github/codeql-action*"
